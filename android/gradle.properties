org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Kotlin incremental compilation to prevent "Storage already registered"
# errors that occur when multiple subprojects share the same build output directory.
kotlin.incremental=false

# Gradle daemon & parallel settings for cleaner builds
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
